[package]
name = "gpgui-gtk"
rust-version.workspace = true
authors.workspace = true
version.workspace = true
edition.workspace = true
license = "GPL-3.0"
description = "Open-source GTK4/libadwaita GUI for GlobalProtect-openconnect"

[[bin]]
name = "gpgui-gtk"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
log.workspace = true
env_logger.workspace = true
gtk = { version = "0.10.3", package = "gtk4", features = ["v4_12"] }
adw = { version = "0.8", package = "libadwaita", features = ["v1_5"] }
ksni = { version = "0.3.7", default-features = false, features = ["tokio", "blocking"] }
oo7 = { version = "0.5.0", default-features = false, features = ["tokio", "native_crypto"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
async-channel = "2.5.0"
