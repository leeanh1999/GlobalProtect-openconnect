name: GlobalProtect VPN apps

# Builds the open-source GUIs with the service stack from this commit:
#  - Linux:   gpgui-gtk + gpservice/gpclient/gpauth tarballs (x86_64, aarch64)
#  - Windows: gpgui-win + gpservice/gpauth + OpenConnect, NSIS installers (x64, arm64)
# Push to main / PR / manual run: build + test, upload artifacts.
# Push a tag "gui-v*" (or the older "gtk-v*"): also publish a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["gui-v*", "gtk-v*"]
    paths:
      - "apps/gpgui-gtk/**"
      - "apps/gpgui-win/**"
      - "apps/gpservice/**"
      - "apps/gpauth/**"
      - "apps/gpclient/**"
      - "crates/**"
      - "packaging/windows-oss/**"
      - "scripts/build-gpgui-win.ps1"
      - "scripts/build-openconnect-windows.*"
      - "Cargo.lock"
      - ".github/workflows/gpgui.yaml"
  pull_request:
    paths:
      - "apps/gpgui-gtk/**"
      - "apps/gpgui-win/**"
      - "crates/gpdesktop/**"
      - "packaging/windows-oss/**"
      - ".github/workflows/gpgui.yaml"
  workflow_dispatch:

concurrency:
  group: gpgui-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  linux:
    name: linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          # The x86_64 image points at an EC2 regional mirror that often stalls
          # (~30 s timeout per package, 35+ min in total). Use the Azure mirror,
          # fail fast and retry. ports.ubuntu.com (aarch64) is left as is.
          for f in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
            [ -f "$f" ] && sudo sed -Ei 's#https?://[a-z0-9.-]*archive\.ubuntu\.com/ubuntu#http://azure.archive.ubuntu.com/ubuntu#g' "$f"
          done
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' | sudo tee /etc/apt/apt.conf.d/99ci-network >/dev/null
          # Skip man page index rebuilds while installing.
          echo 'man-db man-db/auto-update boolean false' | sudo debconf-set-selections
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config patch \
            autoconf automake autopoint libtool gettext \
            libgtk-4-dev libadwaita-1-dev librsvg2-common \
            libwebkit2gtk-4.1-dev libsecret-1-dev libdbus-1-dev libssl-dev \
            libxml2-dev zlib1g-dev liblz4-dev libgnutls28-dev libp11-kit-dev nettle-dev libgmp-dev

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.arch }}

      - name: Test
        run: cargo test --locked -p gpdesktop -p gpgui-gtk

      - name: Build release binaries
        run: cargo build --release --locked -p gpservice -p gpclient -p gpauth -p gpgui-gtk

      - name: Package
        id: pkg
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#*-v}"
          else
            version="snapshot-${GITHUB_SHA::7}"
          fi
          name="gpgui-gtk-${version}-linux-${{ matrix.arch }}"
          dest="dist/$name"
          # Mirror the repo layout so the bundled install.sh works unchanged.
          mkdir -p "$dest/target/release" "$dest/apps/gpgui-gtk" "$dest/packaging/files/usr/libexec/gpclient" \
            "$dest/packaging/files/usr/share/polkit-1/actions"
          install -m755 target/release/gpservice target/release/gpclient target/release/gpauth target/release/gpgui-gtk \
            target/release/gp-vpnc-script-installer target/release/gp-hip-script-installer "$dest/target/release/"
          install -m644 packaging/files/usr/share/polkit-1/actions/com.yuezk.gpgui.policy "$dest/packaging/files/usr/share/polkit-1/actions/"
          cp -r apps/gpgui-gtk/data apps/gpgui-gtk/install.sh apps/gpgui-gtk/README.md "$dest/apps/gpgui-gtk/"
          install -m755 packaging/files/usr/libexec/gpclient/vpnc-script "$dest/packaging/files/usr/libexec/gpclient/"
          cp LICENSE "$dest/"
          cat > "$dest/INSTALL.txt" <<'EOF'
          Runtime deps (Debian/Ubuntu):
            sudo apt install libgtk-4-1 libadwaita-1-0 libwebkit2gtk-4.1-0 pkexec
          Install:
            sudo sh apps/gpgui-gtk/install.sh
          EOF
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  windows:
    name: windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            msystem: UCRT64
            subsystem: ucrt64
            packages: >-
              mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-gnutls
              mingw-w64-ucrt-x86_64-libxml2 mingw-w64-ucrt-x86_64-lz4
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            subsystem: clangarm64
            packages: >-
              mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-pkgconf mingw-w64-clang-aarch64-gnutls
              mingw-w64-clang-aarch64-libxml2 mingw-w64-clang-aarch64-lz4
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            base-devel autoconf automake libtool gettext
            ${{ matrix.packages }}

      - name: Install NSIS
        run: |
          choco install nsis --version=3.12.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Installing NSIS failed.' }

      # Same version as rust-toolchain.toml; the ARM image may not ship rustup.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.arch }}

      - name: Test
        run: cargo test --locked -p gpdesktop -p gpgui-win

      - name: Build installer
        env:
          MSYS_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          ./scripts/build-gpgui-win.ps1 -Arch ${{ matrix.arch }} -MsysRoot $env:MSYS_ROOT -MsysSubsystem ${{ matrix.subsystem }}
          if ($LASTEXITCODE) { throw "build-gpgui-win.ps1 failed ($LASTEXITCODE)" }
          $setup = Get-ChildItem target/windows-oss/GlobalProtectVPN-*-${{ matrix.arch }}-setup.exe | Select-Object -First 1
          $hash = (Get-FileHash $setup).Hash.ToLower()
          "$hash  $($setup.Name)" | Set-Content -NoNewline -Encoding ascii "$($setup.FullName).sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: gpgui-win-${{ matrix.arch }}
          path: |
            target/windows-oss/GlobalProtectVPN-*-${{ matrix.arch }}-setup.exe
            target/windows-oss/GlobalProtectVPN-*-${{ matrix.arch }}-setup.exe.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: GlobalProtect VPN ${{ github.ref_name }} (Linux + Windows)
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.exe
          generate_release_notes: true
          body: |
            Open-source GUIs for GlobalProtect-openconnect, bundled with the VPN service built from this release.

            ## Linux — gpgui-gtk (GTK4/libadwaita)
            Debian/Ubuntu, x86_64 or aarch64:
            ```sh
            tar xzf gpgui-gtk-*-linux-$(uname -m).tar.gz
            cd gpgui-gtk-*-linux-$(uname -m)
            sudo sh apps/gpgui-gtk/install.sh
            ```
            Built on Ubuntu 24.04 (glibc 2.39); see INSTALL.txt for runtime packages.

            ## Windows — GlobalProtect VPN (gpgui-win)
            Windows 10 19041+ / Windows 11 (x64), Windows 11 on ARM (arm64): run `GlobalProtectVPN-*-x64-setup.exe` or `GlobalProtectVPN-*-arm64-setup.exe`, approve the administrator prompt, then open **GlobalProtect VPN** from the Start menu.
            - The installer is not code-signed; SmartScreen may warn. Verify it with the `.sha256` file.
            - It uses the same Windows service as the official GP Connect; uninstall GP Connect first.
            - No HIP reports on Windows. Internal (non-tunnel) gateways are not supported yet.
