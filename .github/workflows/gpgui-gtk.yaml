name: gpgui-gtk

# Builds the open-source GTK GUI together with gpclient/gpauth.
#  - push to gtk-gui / PR touching the GUI: build + test, upload artifacts
#  - push a tag "gtk-v*" (e.g. gtk-v0.1.0): also publish a GitHub Release
on:
  push:
    branches: [gtk-gui]
    tags: ["gtk-v*"]
    paths:
      - "apps/gpgui-gtk/**"
      - "Cargo.lock"
      - ".github/workflows/gpgui-gtk.yaml"
  pull_request:
    paths:
      - "apps/gpgui-gtk/**"
      - ".github/workflows/gpgui-gtk.yaml"
  workflow_dispatch:

concurrency:
  group: gpgui-gtk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config patch \
            autoconf automake autopoint libtool gettext \
            libgtk-4-dev libadwaita-1-dev librsvg2-common \
            libwebkit2gtk-4.1-dev libsecret-1-dev libdbus-1-dev libssl-dev \
            libxml2-dev zlib1g-dev liblz4-dev libgnutls28-dev libp11-kit-dev nettle-dev libgmp-dev

      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Test GUI
        run: cargo test --locked -p gpgui-gtk

      - name: Build release binaries
        run: cargo build --release --locked -p gpservice -p gpclient -p gpauth -p gpgui-gtk

      - name: Package
        id: pkg
        run: |
          if [[ "$GITHUB_REF" == refs/tags/gtk-v* ]]; then
            version="${GITHUB_REF_NAME#gtk-v}"
          else
            version="snapshot-${GITHUB_SHA::7}"
          fi
          name="gpgui-gtk-${version}-linux-${{ matrix.arch }}"
          dest="dist/$name"
          # Mirror the repo layout so the bundled install.sh works unchanged.
          mkdir -p "$dest/target/release" "$dest/apps/gpgui-gtk" "$dest/packaging/files/usr/libexec/gpclient" \
            "$dest/packaging/files/usr/share/polkit-1/actions"
          install -m755 target/release/gpservice target/release/gpclient target/release/gpauth target/release/gpgui-gtk \
            target/release/gp-vpnc-script-installer target/release/gp-hip-script-installer "$dest/target/release/"
          install -m644 packaging/files/usr/share/polkit-1/actions/com.yuezk.gpgui.policy "$dest/packaging/files/usr/share/polkit-1/actions/"
          cp -r apps/gpgui-gtk/data apps/gpgui-gtk/install.sh apps/gpgui-gtk/README.md "$dest/apps/gpgui-gtk/"
          install -m755 packaging/files/usr/libexec/gpclient/vpnc-script "$dest/packaging/files/usr/libexec/gpclient/"
          cp LICENSE "$dest/"
          cat > "$dest/INSTALL.txt" <<'EOF'
          Runtime deps (Debian/Ubuntu):
            sudo apt install libgtk-4-1 libadwaita-1-0 libwebkit2gtk-4.1-0 pkexec
          Install:
            sudo sh apps/gpgui-gtk/install.sh
          EOF
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/gtk-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: gpgui-gtk ${{ github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
          body: |
            Open-source GTK4/libadwaita GUI for GlobalProtect-openconnect, bundled with `gpservice`, `gpclient` and `gpauth`. Like the official GUI, it talks to the root `gpservice`, so connecting needs no admin password.

            **Install** (Debian/Ubuntu, x86_64 or aarch64):
            ```sh
            tar xzf gpgui-gtk-*-linux-$(uname -m).tar.gz
            cd gpgui-gtk-*-linux-$(uname -m)
            sudo sh apps/gpgui-gtk/install.sh
            ```
            Built on Ubuntu 24.04 (glibc 2.39); see INSTALL.txt for runtime packages.
